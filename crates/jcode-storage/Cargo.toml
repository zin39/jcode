[package]
name = "jcode-storage"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Exposes `scoped_test_home` so downstream crates can isolate `jcode_dir()`
# per test thread instead of racing on the process-global JCODE_HOME.
test-support = ["dep:tempfile"]

[dependencies]
anyhow = "1"
dirs = "5"
jcode-core = { path = "../jcode-core" }
libc = "0.2"
rand = "0.9.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
