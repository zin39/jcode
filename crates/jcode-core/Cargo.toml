[package]
name = "jcode-core"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Exposes the per-thread JCODE_HOME override so downstream test targets get
# isolated homes without editing every test.
test-support = []

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9.3"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
